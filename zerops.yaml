zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
        - npx esbuild scripts/migrate.mjs --bundle --platform=node --format=esm --outfile=.next/migrate.bundle.mjs
      deployFiles:
        - .next/standalone/~
        - .next/static
        - .next/migrate.bundle.mjs
        - public
        - db
        - scripts
      cache: node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        DATABASE_URL: ${db_connectionString}/${db_dbName}
      initCommands:
        - zsc execOnce ${appVersionId} --retryUntilSuccessful -- node .next/migrate.bundle.mjs
      start: node server.js
      healthCheck:
        httpGet:
          port: 3000
          path: /api/health
